<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — M&M Clothing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <!-- Wordmark Logo -->
    <a href="index.html" class="wordmark">
      <span>M</span>&<span>M Clothing</span>
    </a>
    <nav class="main-nav">
      <a href="index.html" class="active">Home</a>
      <a href="catalog.html">Shop</a>
      <a href="about.html" class="hide-mobile">About</a>
      <button id="open-cart" class="cart-btn" aria-label="Open cart">
        Bag <span class="cart-count" id="cart-count">0</span>
      </button>
    </nav>
  </div>
</header>

<div class="wrap" id="product-root">
  <!-- Filled by js/product.js -->
</div>


<footer class="site-footer">
  <div class="wrap">
    <div class="footer-left">
      <a href="index.html" class="footer-logo">
        <img src="images/NameLogo.png" alt="M&amp;M Clothing">
      </a>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="returns.html">Return Policy</a>
         <a href="/terms">Terms of Service</a>
      </div>
    </div>
    <div class="footer-right">
      <span>&copy; <span id="year"></span> M&amp;M Clothing, Sri Lanka</span>
    </div>
  </div>
</footer>

<div class="overlay" id="cart-overlay"></div>
<aside class="drawer" id="cart-drawer">
  <div class="drawer-head">
    <h3>Your bag</h3>
    <button class="drawer-close" id="close-cart" aria-label="Close cart">&times;</button>
  </div>
  <div class="drawer-items" id="drawer-items"></div>
  <div class="drawer-foot" id="drawer-foot">
    <div class="drawer-total"><span>Total</span><span id="drawer-total-amount">Rs. 0</span></div>
    <button class="btn clay" id="whatsapp-checkout">Send order on WhatsApp</button>
    <div class="drawer-hint">We'll reply on WhatsApp to confirm details and delivery.</div>
  </div>
</aside>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
